plugins {
    id("com.android.application")
}

android {
    namespace = "com.rmm.controller"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.rmm.controller"
        minSdk = 28
        targetSdk = 34
        // Suite version is mirrored manually on each release:
        // versionName = suite (e.g. 1.46.96), versionCode = M*1000000+m*1000+p.
        versionCode = 1046096
        versionName = "1.46.96"
    }

    signingConfigs {
        // Release key lives OUTSIDE the repo (~/.gradle/gradle.properties:
        // rmm.keyStore, rmm.keyAlias, rmm.storePassword, rmm.keyPassword).
        // Missing props fall back to the debug key so any dev box builds.
        release {
            storeFile = findProperty("rmm.keyStore") != null ? file(findProperty("rmm.keyStore")) : null
            storePassword = findProperty("rmm.storePassword")
            keyAlias = findProperty("rmm.keyAlias")
            keyPassword = findProperty("rmm.keyPassword")
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // gomobile-bound controller core (built via:
    // gomobile bind -androidapi 28 -target android/arm64
    //   -o android/app/libs/rmm.aar rmm/mobile)
    implementation(files("libs/rmm.aar"))
    // Jarvis hotword: Porcupine wake-word (primary, needs access key) +
    // Vosk keyword spotting (fallback, needs ~50MB model at runtime).
    implementation("ai.picovoice:porcupine-android:4.0.2")
    implementation("com.alphacephei:vosk-android:0.3.75")
}

// Bundled controller identity (used by SetupActivity.ensureIdentity):
// stage before building (gitignored, never committed):
//   copy agent_token.txt, server.crt, server.key from the controller PC
//   into android/app/src/main/res/raw/ as agent_token.txt, server_crt,
//   server_key. Rotations ride the next APK build.
